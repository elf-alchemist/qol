name: Continuous Integration

on:
  push:
    branches: [trunk]
    tags: ["*"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [trunk]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PK3
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: >-
          bash make.sh
          cd dist
          zip QOL_Latest.zip *

      - name: Extract Revision Number
        shell: bash
        run: >-
          echo "REV_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Update Latest Tag
        run: |
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          git tag latest HEAD
          git push origin latest

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: "QOL Pack Revision ${{ env.REV_COUNT }}"
          # bodyFile: CHANGELOG.md
          tag: latest
          allowUpdates: true
          artifacts: dist/QOL_Latest.zip
